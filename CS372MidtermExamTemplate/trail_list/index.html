<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trail Finder</title>
    <link rel="stylesheet" href="trail-list.css">
    <script defer src="trail-list.js"></script>
</head>

<body>
    <header>
        <h1>Trail Finder</h1>
        <p>Find a trail for your next outdoor adventure.</p>
    </header>

<!-- BEGIN COPY SECTION ------------------------------------->
    <main>
        <section class="controls">
            <h2>Add a Trail</h2>
            <form id="trailForm" onsubmit="addTrail(event)">
                <div class="field">
                    <label for="trailName">Trail Name</label>
                    <input id="trailName" name="trailName" type="text" required>
                </div>
                <div class="field">
                    <label for="trailDistance">Distance (miles)</label>
                    <input
                        id="trailDistance"
                        name="trailDistance"
                        type="number"
                        min="0.1"
                        step="0.1"
                        required
                    >
                </div>
                <button type="submit">Add Trail</button>
            </form>
        </section>

        <section class="controls filters">
            <div class="field">
                <label for="distanceSelect">Distance</label>
                <select id="distanceSelect" onchange="displayTrails()">
                    <option value="All">All Distances</option>
                    <option value="0-1">0-1 Miles</option>
                    <option value="1-3">1-3 Miles</option>
                    <option value="3+">3+ Miles</option>
                </select>
            </div>
            <div class="field">
                <label for="sortSelect">Sort By</label>
                <select id="sortSelect" onchange="displayTrails()">
                    <option value="name">Trail Name</option>
                    <option value="distance">Distance</option>
                </select>
            </div>
            <button
                id="sortDirection"
                type="button"
                onclick="toggleSortDirection()"
            >
                ↑ Ascending
            </button>
        </section>
<!-- END COPY SECTION --------------------------------------->
        <p id="status"></p>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Trail</th>
                        <th scope="col">Distance</th>
                    </tr>
                </thead>
                <tbody id="trailRows">
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
